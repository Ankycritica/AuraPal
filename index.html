<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/src/assets/AURAPAL.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />

    <!-- Primary metadata -->
    <title>AuraPal — Chat With Strangers & Make Real Connections</title>
    <meta name="title" content="AuraPal — Chat With Strangers & Make Real Connections" />
    <meta
      name="description"
      content="AuraPal is your AI-powered career and income engine. Fix your resume, generate SEO articles, roast your LinkedIn, build business plans, and discover profitable side hustles."
    />
    <meta
      name="keywords"
      content="AI resume fixer, SEO article generator, LinkedIn optimizer, business plan generator, side hustle ideas, AI writing tool, career growth AI"
    />
    <meta name="author" content="AuraPal" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurapal.io/" />
    <meta
      property="og:title"
      content="AuraPal — AI Career &amp; Growth Engine"
    />
    <meta
      property="og:description"
      content="Fix resumes, generate SEO content, build business plans, and find profitable side hustles — powered by AI."
    />
    <meta property="og:image" content="/src/assets/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aurapal" />
    <meta
      name="twitter:title"
      content="AuraPal — AI Career &amp; Growth Engine"
    />
    <meta
      name="twitter:description"
      content="Your AI engine for career advancement and income generation. Resume, SEO, LinkedIn, and more."
    />
    <meta name="twitter:image" content="/src/assets/og-image.png" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Example font (optional) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- App manifest (optional) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fallback CSS for non-JS users -->
    <noscript>
      <style>
        body {
          background: #0b1220;
          color: #e6eef8;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto,
            "Helvetica Neue", Arial;
        }
      </style>
    </noscript>
  </head>

  <body>
    <div id="root" aria-live="polite"></div>

    <!-- Prevent theme flash on page load -->
    <script>
      const theme = localStorage.getItem('ap-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    </script>

    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
