version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - TURN_URL=${TURN_URL:-}
      - TURN_USER=${TURN_USER:-}
      - TURN_PASSWORD=${TURN_PASSWORD:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:3000
    depends_on:
      - server
    restart: unless-stopped
